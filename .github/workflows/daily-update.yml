name: Daily data update

on:
  schedule:
    # 8 AM Toronto time. GitHub schedules only use UTC, so this runs at both
    # possible UTC hours (12:00 during EDT, 13:00 during EST) and the first
    # step skips whichever one isn't 8 AM for the current season.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:                      # rebuild pages when the build tools change
    branches: [main]
    paths:
      - "tools/**"
      - "catalog.js"
      - "official-programs.js"
      - "deadlines.json"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only run at 8 AM Toronto time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$(TZ=America/Toronto date +%Z)" = "EDT" ]; then want="0 12 * * *"; else want="0 13 * * *"; fi
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" != "$want" ]; then
            echo "This is the other season's slot; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Pull new spreadsheet entries
        if: steps.gate.outputs.run == 'true'
        run: python tools/update_data.py && python tools/update_bc.py

      - name: Split data (Fall 2027 first, older years on request)
        if: steps.gate.outputs.run == 'true'
        run: python tools/split_data.py

      - name: Build program pages and sitemap
        if: steps.gate.outputs.run == 'true'
        run: node tools/build-site.mjs

      - name: Check program names (casing, short forms, typos)
        if: steps.gate.outputs.run == 'true'
        run: node tools/name-check.mjs

      - name: Check application deadlines are still current
        if: steps.gate.outputs.run == 'true'
        run: node tools/deadline-check.mjs

      - name: Publish if anything changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git add -A snapshot.json data programs schools feeds guides changelog sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes today."
            exit 0
          fi
          git config user.name "Offer Atlas"
          git config user.email "site@offeratlas.invalid"
          git commit -m "Daily data update $(TZ=America/Toronto date +%Y-%m-%d)"
          git push

      - name: Send phone notification (ntfy)
        # Morning runs and manual runs only, and also when anything above failed.
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.gate.outputs.run == 'true' || failure())
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC secret set; skipping the phone notification."; exit 0; fi
          python tools/notify_summary.py --send
