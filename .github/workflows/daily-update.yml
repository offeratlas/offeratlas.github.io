name: Daily data update

on:
  schedule:
    # The hourly updates (7 AM to midnight Toronto time) are started by cron-job.org through
    # workflow_dispatch. This GitHub schedule is only a backup in case that ever stops: GitHub
    # often starts timed jobs late or drops them, so it wakes every 30 minutes in the morning
    # and runs the update once per day, on the first wake-up at or after 7 AM, if nothing has yet.
    - cron: "7,37 11-17 * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:                      # rebuild pages when the build tools change
    branches: [main]
    paths:
      - "tools/**"
      - "catalog.js"
      - "official-programs.js"
      - "deadlines.json"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Backup schedule runs at most once a day, at or after 7 AM Toronto time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          today=$(TZ=America/Toronto date +%F); hour=$(TZ=America/Toronto date +%-H)
          last=$(cat data/last-morning-run.txt 2>/dev/null || true)
          if [ "$EVENT" = "schedule" ] && { [ "$hour" -lt 7 ] || [ "$last" = "$today" ]; }; then
            echo "Not time yet, or today's morning update already ran ($last); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Remember which reports were already on the site (for the hourly phone message)
        if: steps.gate.outputs.run == 'true'
        run: python -c "import json;s=json.load(open('snapshot.json',encoding='utf-8'));json.dump([r['id'] for r in s['reports']],open('/tmp/before_ids.json','w'))"

      - name: Pull new spreadsheet entries
        if: steps.gate.outputs.run == 'true'
        run: python tools/update_data.py && python tools/update_bc.py

      - name: Check for duplicate results (stops the update if it finds any)
        if: steps.gate.outputs.run == 'true'
        run: python tools/duplicate-check.py

      - name: Split data (Fall 2027 first, older years on request)
        if: steps.gate.outputs.run == 'true'
        run: python tools/split_data.py

      - name: Build program pages and sitemap
        if: steps.gate.outputs.run == 'true'
        run: node tools/build-site.mjs

      - name: Check program names (casing, short forms, typos)
        if: steps.gate.outputs.run == 'true'
        run: node tools/name-check.mjs

      - name: Check application deadlines are still current
        if: steps.gate.outputs.run == 'true'
        run: node tools/deadline-check.mjs

      - name: Publish if anything changed
        id: publish
        if: steps.gate.outputs.run == 'true'
        run: |
          # The first update at or after 7 AM each day sends the morning summary to your phone.
          today=$(TZ=America/Toronto date +%F); hour=$(TZ=America/Toronto date +%-H)
          last=$(cat data/last-morning-run.txt 2>/dev/null || true)
          if [ "${{ github.event_name }}" != "push" ] && [ "$hour" -ge 7 ] && [ "$last" != "$today" ]; then
            echo "$today" > data/last-morning-run.txt
            echo "first=true" >> "$GITHUB_OUTPUT"
          fi
          printf '{"checkedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/last-run.json   # shown as "Last updated" on the site
          python tools/log_added.py   # how many results this update added (for the phone messages)
          git add -A snapshot.json data programs schools feeds guides changelog sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes today."
            exit 0
          fi
          git config user.name "Offer Atlas"
          git config user.email "site@offeratlas.invalid"
          git commit -m "Data update $(TZ=America/Toronto date '+%Y-%m-%d %H:%M')"
          ok=""; for i in 1 2 3; do if git pull --rebase -q origin main && git push; then ok=1; break; fi; sleep 10; done
          [ -n "$ok" ]   # fail the step (and alert your phone) if the push never went through

      - name: Send phone notification (ntfy)
        # After every hourly update: what's new this hour. The first update at or after 7 AM also
        # summarises yesterday. Failures always send an alert.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (failure() || steps.gate.outputs.run == 'true')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
          MORNING: ${{ steps.publish.outputs.first }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC secret set; skipping the phone notification."; exit 0; fi
          python tools/notify_summary.py --send
