name: Daily data update

on:
  schedule:
    # 8 AM Toronto time. GitHub often starts timed jobs late (sometimes hours) or
    # drops them, so this wakes up every 30 minutes from early morning to about noon Toronto
    # time (EDT or EST); the gate step runs the real update once per day, on the
    # first wake-up at or after 8 AM, and skips the rest in a few seconds.
    - cron: "7,37 11-17 * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:                      # rebuild pages when the build tools change
    branches: [main]
    paths:
      - "tools/**"
      - "catalog.js"
      - "official-programs.js"
      - "deadlines.json"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Only run once a day, at or after 8 AM Toronto time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          today=$(TZ=America/Toronto date +%F); hour=$(TZ=America/Toronto date +%-H)
          last=$(cat data/last-morning-run.txt 2>/dev/null || true)
          if [ "$EVENT" = "schedule" ] && { [ "$hour" -lt 8 ] || [ "$last" = "$today" ]; }; then
            echo "Not time yet, or today's morning update already ran ($last); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Pull new spreadsheet entries
        if: steps.gate.outputs.run == 'true'
        run: python tools/update_data.py && python tools/update_bc.py

      - name: Split data (Fall 2027 first, older years on request)
        if: steps.gate.outputs.run == 'true'
        run: python tools/split_data.py

      - name: Build program pages and sitemap
        if: steps.gate.outputs.run == 'true'
        run: node tools/build-site.mjs

      - name: Check program names (casing, short forms, typos)
        if: steps.gate.outputs.run == 'true'
        run: node tools/name-check.mjs

      - name: Check application deadlines are still current
        if: steps.gate.outputs.run == 'true'
        run: node tools/deadline-check.mjs

      - name: Publish if anything changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then TZ=America/Toronto date +%F > data/last-morning-run.txt; fi
          git add -A snapshot.json data programs schools feeds guides changelog sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes today."
            exit 0
          fi
          git config user.name "Offer Atlas"
          git config user.email "site@offeratlas.invalid"
          git commit -m "Daily data update $(TZ=America/Toronto date +%Y-%m-%d)"
          git push

      - name: Send phone notification (ntfy)
        # Morning runs and manual runs only, and also when anything above failed.
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.gate.outputs.run == 'true' || failure())
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC secret set; skipping the phone notification."; exit 0; fi
          python tools/notify_summary.py --send
